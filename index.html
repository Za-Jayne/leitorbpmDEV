<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leitor BPM</title>

  <!-- Biblioteca Tesseract.js para OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
      color: #202124;
    }

    main {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 { color: #174ea6; text-align: center; }

    button, input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: 0;
      background: #188038;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; cursor: not-allowed; }

    input {
      border: 1px solid #dadce0;
      background: white;
      color: #202124;
      text-align: center;
      font-weight: bold;
      font-size: 20px;
    }

    .fechar { background: #5f6368; }
    .capturar { background: #174ea6; }

    .camera-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      margin: 12px auto;
      border-radius: 8px;
      overflow: hidden;
      background: #202124;
    }

    #videoOCR {
      display: block;
      width: 100%;
      height: auto;
      max-height: 400px;
      object-fit: cover;
    }

    .guia-enquadramento {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      height: 35%;
      border: 2px dashed #ffeb3b;
      border-radius: 6px;
      pointer-events: none;
      box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.4);
    }

    #mensagemOCR {
      margin-top: 12px;
      text-align: center;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.5;
      font-weight: bold;
      color: #174ea6;
    }

    .instrucao {
      color: #5f6368;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
<main>
  <h2>Leitor de BPM por Foto</h2>

  <p class="instrucao">
    Enquadre o número da etiqueta no retângulo amarelo e clique em capturar.
  </p>

  <button id="iniciarOCR" onclick="iniciarCamera()">
    📷 Abrir Câmera
  </button>

  <div id="painelOCR" hidden>
    <div class="camera-container">
      <video id="videoOCR" autoplay playsinline muted></video>
      <div class="guia-enquadramento"></div>
    </div>

    <button class="capturar" onclick="tirarFotoEProcessar()">
      📸 Capturar e Ler Etiqueta
    </button>

    <div id="mensagemOCR" aria-live="polite"></div>

    <label for="bpmOCR" style="display:block; margin-top:15px; font-size:13px; color:#5f6368; font-weight: bold;">
      BPM (Toque para digitar/corrigir se necessário):
    </label>

    <input
      id="bpmOCR"
      type="text"
      inputmode="numeric"
      placeholder="Digite ou capture o BPM"
      autocomplete="off"
    >

    <button id="confirmarOCR" onclick="confirmarOCR()" style="background: #188038;">
      ✔️ Confirmar BPM e Pesquisar na Planilha
    </button>

    <button class="fechar" onclick="pararCamera()">
      Fechar Câmera
    </button>
  </div>
</main>

<canvas id="canvasOculto" hidden></canvas>

<script>
  const APP_URL = "https://script.google.com/macros/s/AKfycbwtc7P8xFefVvwFSMQHxDcGs-K4aWwbBwTrdyI5qH2JmoNIIhK1t5DbpdecyuXexLoVuQ/exec";

  let streamOCR = null;
  let workerOCR = null;

  async function iniciarCamera() {
    const painel = document.getElementById("painelOCR");
    const video = document.getElementById("videoOCR");
    const status = document.getElementById("mensagemOCR");
    const botaoIniciar = document.getElementById("iniciarOCR");

    painel.hidden = false;
    botaoIniciar.disabled = true;
    status.textContent = "Iniciando câmera...";
    document.getElementById("bpmOCR").value = "";

    try {
      streamOCR = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });

      video.srcObject = streamOCR;
      await video.play();
      status.textContent = "Posicione o BPM no retângulo amarelo.";
    } catch (erro) {
      status.textContent = "Erro ao acessar a câmera: " + (erro.message || erro);
      botaoIniciar.disabled = false;
      painel.hidden = true;
    }
  }

  async function tirarFotoEProcessar() {
    const video = document.getElementById("videoOCR");
    const canvas = document.getElementById("canvasOculto");
    const status = document.getElementById("mensagemOCR");
    const campoBpm = document.getElementById("bpmOCR");

    if (!video.videoWidth) {
      status.textContent = "Aguarde a câmera estabilizar...";
      return;
    }

    status.textContent = "Processando imagem...";

    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    
    // Coordenadas para recortar apenas a região central (onde fica o retângulo amarelo)
    const larguraVideo = video.videoWidth;
    const alturaVideo = video.videoHeight;
    const recW = larguraVideo * 0.75;
    const recH = alturaVideo * 0.30;
    const recX = (larguraVideo - recW) / 2;
    const recY = (alturaVideo - recH) / 2;

    // Redimensiona o canvas para focar na área recortada com zoom (2x)
    canvas.width = recW * 2;
    canvas.height = recH * 2;

    // Desenha e aplica filtros de alto contraste e escala de cinza para facilitar o OCR
    ctx.drawImage(video, recX, recY, recW, recH, 0, 0, canvas.width, canvas.height);
    
    // Puxa os pixels para aplicar melhoria manual de contraste via código
    let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      // Converte para escala de cinza e aumenta o contraste
      let v = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
      // Limiar de contraste forte (Binarização simples)
      v = v < 130 ? 0 : 255; 
      d[i] = d[i+1] = d[i+2] = v;
    }
    ctx.putImageData(imgData, 0, 0);

    try {
      if (!workerOCR) {
        status.textContent = "Carregando motor de leitura (1ª vez)...";
        workerOCR = await Tesseract.createWorker("eng");
        await workerOCR.setParameters({
          tessedit_char_whitelist: "0123456789",
        });
      }

      status.textContent = "Lendo números...";
      const resultado = await workerOCR.recognize(canvas);
      const texto = resultado.data.text || "";

      // Procura sequências numéricas (aceita números de 3 a 10 dígitos)
      const candidatos = texto.match(/\d{3,10}/g) || [];

      if (candidatos.length > 0) {
        candidatos.sort((a, b) => b.length - a.length);
        campoBpm.value = candidatos[0];
        status.style.color = "#188038";
        status.textContent = "BPM lido com sucesso! Confira abaixo.";
      } else {
        status.style.color = "#d93025";
        status.textContent = "Não foi automático. Digite o número abaixo se preferir:";
      }

    } catch (erro) {
      status.style.color = "#d93025";
      status.textContent = "Digite o número do BPM no campo abaixo:";
    }
  }

  function confirmarOCR() {
    const campo = document.getElementById("bpmOCR");
    const bpm = campo.value.trim();

    if (!/^\d+$/.test(bpm)) {
      alert("Por favor, digite ou capture um número de BPM válido.");
      return;
    }

    pararCamera();
    window.location.href = APP_URL + "?bpm=" + encodeURIComponent(bpm);
  }

  function pararCamera() {
    if (streamOCR) {
      streamOCR.getTracks().forEach(track => track.stop());
      streamOCR = null;
    }

    document.getElementById("videoOCR").srcObject = null;
    document.getElementById("painelOCR").hidden = true;
    document.getElementById("iniciarOCR").disabled = false;
    document.getElementById("mensagemOCR").textContent = "";
  }
</script>
</body>
</html>
