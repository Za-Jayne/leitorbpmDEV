
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142d4e">
  <title>Leitor BPM</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --marinho: #142d4e;
      --marinho2: #203f65;
      --verde: #20c878;
      --fundo: #f3f5f8;
      --texto: #202b3c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: var(--fundo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .cabecalho {
      padding: 18px;
      margin-bottom: 16px;
      color: white;
      background: var(--marinho);
      border-radius: 14px;
    }

    .cabecalho h1 {
      margin: 0 0 7px;
      font-size: 23px;
    }

    .cabecalho p {
      margin: 0;
      color: #d8e4f2;
      font-size: 14px;
      line-height: 1.4;
    }

    .painel {
      padding: 16px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 14px #142d4e12;
    }

    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #10151c;
      border-radius: 12px;
    }

    #video,
    #photo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #10151c;
    }

    #photo {
      position: absolute;
      inset: 0;
    }

    .moldura {
      position: absolute;
      left: 5%;
      top: 8%;
      width: 90%;
      height: 72%;
      border: 3px solid var(--verde);
      border-radius: 8px;
      pointer-events: none;
      box-shadow: 0 0 0 999px #00000018;
    }

    .orientacao {
      margin: 12px 0 16px;
      color: #536174;
      font-size: 13px;
      line-height: 1.5;
    }

    .botoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      min-height: 46px;
      padding: 12px 14px;
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .primario {
      color: white;
      background: var(--marinho);
    }

    .secundario {
      color: var(--marinho);
      background: #e7edf4;
    }

    .verde {
      width: 100%;
      margin-top: 12px;
      color: white;
      background: #168653;
    }

    .campo {
      margin-top: 18px;
    }

    .campo label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    #bpmInput {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border: 1px solid #cbd4df;
      border-radius: 9px;
      font-size: 21px;
      letter-spacing: 1px;
    }

    #status {
      min-height: 42px;
      margin-top: 14px;
      padding: 11px;
      border-radius: 8px;
      background: #edf1f6;
      color: #34445a;
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 360px) {
      body {
        padding: 10px;
      }

      .painel {
        padding: 12px;
      }

      .botoes {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="cabecalho">
      <h1>Leitor BPM</h1>
      <p>Capture a etiqueta patrimonial e confira o número reconhecido antes de consultar.</p>
    </header>

    <section class="painel">
      <div class="camera-box" id="cameraBox">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="photo" class="hidden"></canvas>
        <div class="moldura" id="moldura"></div>
      </div>

      <p class="orientacao">
        Enquadre a etiqueta inteira dentro da moldura verde. Mantenha o celular
        firme, aguarde o foco e toque em <strong>Capturar etiqueta</strong>.
      </p>

      <div class="botoes">
        <button type="button" id="openBtn" class="primario">
          Abrir câmera
        </button>

        <button type="button" id="captureBtn" class="primario" disabled>
          Capturar etiqueta
        </button>

        <button type="button" id="retryBtn" class="secundario hidden">
          Capturar novamente
        </button>

        <button type="button" id="closeBtn" class="secundario hidden">
          Fechar câmera
        </button>
      </div>

      <div class="campo">
        <label for="bpmInput">BPM reconhecido</label>

        <input
          id="bpmInput"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="O BPM aparecerá aqui"
        >

        <button type="button" id="searchBtn" class="verde">
          Confirmar e consultar
        </button>
      </div>

      <div id="status" role="status" aria-live="polite">
        Toque em “Abrir câmera” para começar.
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const APP_URL =
      "https://script.google.com/macros/s/AKfycbwtc7P8xFefVvwFSMQHxDcGs-K4aWwbBwTrdyI5qH2JmoNIIhK1t5DbpdecyuXexLoVuQ/exec";

    const video = document.getElementById("video");
    const photo = document.getElementById("photo");
    const cameraBox = document.getElementById("cameraBox");
    const moldura = document.getElementById("moldura");
    const openBtn = document.getElementById("openBtn");
    const captureBtn = document.getElementById("captureBtn");
    const retryBtn = document.getElementById("retryBtn");
    const closeBtn = document.getElementById("closeBtn");
    const searchBtn = document.getElementById("searchBtn");
    const bpmInput = document.getElementById("bpmInput");
    const statusBox = document.getElementById("status");

    let stream = null;
    let worker = null;
    let captured = false;
    let processing = false;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function setBusy(busy) {
      processing = busy;
      openBtn.disabled = busy;
      captureBtn.disabled = busy || !stream || captured;
      retryBtn.disabled = busy;
      searchBtn.disabled = busy;
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.pause();
      video.srcObject = null;
      captureBtn.disabled = true;
    }

    async function openCamera() {
      if (processing) return;

      stopCamera();

      captured = false;
      bpmInput.value = "";

      photo.classList.add("hidden");
      video.classList.remove("hidden");
      moldura.classList.remove("hidden");
      retryBtn.classList.add("hidden");
      closeBtn.classList.remove("hidden");
      openBtn.classList.add("hidden");

      cameraBox.style.aspectRatio = "4 / 3";
      setStatus("Solicitando acesso à câmera...");

      try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error("Este navegador não disponibiliza acesso à câmera.");
        }

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });

        video.srcObject = stream;
        await video.play();

        if (!video.videoWidth) {
          await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => {
              reject(new Error("Tempo esgotado aguardando a câmera."));
            }, 10000);

            video.addEventListener("loadedmetadata", () => {
              clearTimeout(timeout);
              resolve();
            }, { once: true });
          });
        }

        captureBtn.disabled = false;
        setStatus("Câmera ativa. Enquadre a etiqueta e capture.");

      } catch (error) {
        stopCamera();

        openBtn.classList.remove("hidden");
        closeBtn.classList.add("hidden");

        setStatus(
          "Não foi possível abrir a câmera: " +
          (error.message || error.name || "erro desconhecido")
        );
      }
    }

    async function blobToImageSource(blob) {
      if (typeof createImageBitmap === "function") {
        try {
          return await createImageBitmap(blob);
        } catch (error) {
          console.warn("Falha ao decodificar com createImageBitmap:", error);
        }
      }

      return new Promise((resolve, reject) => {
        const objectUrl = URL.createObjectURL(blob);
        const img = new Image();

        img.onload = () => {
          URL.revokeObjectURL(objectUrl);
          resolve(img);
        };

        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error("Não foi possível abrir a foto capturada."));
        };

        img.src = objectUrl;
      });
    }

    async function takePhoto() {
      if (!video.videoWidth || !video.videoHeight) {
        throw new Error("A câmera ainda não está pronta.");
      }

      const ctx = photo.getContext("2d", {
        willReadFrequently: true
      });

      // Congela primeiro o quadro que já está visível.
      photo.width = video.videoWidth;
      photo.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, photo.width, photo.height);

      video.pause();
      video.classList.add("hidden");
      photo.classList.remove("hidden");
      moldura.classList.add("hidden");

      captured = true;
      captureBtn.disabled = true;
      retryBtn.classList.remove("hidden");

      setStatus("Imagem congelada. Preparando reconhecimento...");

      const track = stream && stream.getVideoTracks()[0];

      if (track && "ImageCapture" in window) {
        let bitmap = null;

        try {
          const imageCapture = new ImageCapture(track);
          const blob = await imageCapture.takePhoto();

          if (!(blob instanceof Blob) || blob.size === 0) {
            throw new Error("A câmera não retornou uma foto válida.");
          }

          bitmap = await blobToImageSource(blob);

          const width = bitmap.width || bitmap.naturalWidth;
          const height = bitmap.height || bitmap.naturalHeight;

          if (!width || !height) {
            throw new Error("A foto não possui dimensões válidas.");
          }

          photo.width = width;
          photo.height = height;

          photo.getContext("2d", {
            willReadFrequently: true
          }).drawImage(bitmap, 0, 0, width, height);

        } catch (error) {
          console.warn(
            "A foto de alta resolução falhou. Mantendo o quadro congelado.",
            error
          );
        } finally {
          if (bitmap && typeof bitmap.close === "function") {
            bitmap.close();
          }
        }
      }

      stopCamera();
      cameraBox.style.aspectRatio = photo.width + " / " + photo.height;
    }

    function preprocess(sourceCanvas) {
      const scale = Math.min(
        2,
        2600 / Math.max(sourceCanvas.width, sourceCanvas.height)
      );

      const result = document.createElement("canvas");
      result.width = Math.max(1, Math.round(sourceCanvas.width * scale));
      result.height = Math.max(1, Math.round(sourceCanvas.height * scale));

      const ctx = result.getContext("2d", {
        willReadFrequently: true
      });

      ctx.drawImage(sourceCanvas, 0, 0, result.width, result.height);

      const imageData = ctx.getImageData(
        0, 0, result.width, result.height
      );

      const pixels = imageData.data;

      for (let i = 0; i < pixels.length; i += 4) {
        const gray =
          0.299 * pixels[i] +
          0.587 * pixels[i + 1] +
          0.114 * pixels[i + 2];

        const contrasted = Math.max(
          0,
          Math.min(255, (gray - 110) * 1.45 + 110)
        );

        pixels[i] = contrasted;
        pixels[i + 1] = contrasted;
        pixels[i + 2] = contrasted;
      }

      ctx.putImageData(imageData, 0, 0);
      return result;
    }

    async function getWorker() {
      if (worker) return worker;

      if (typeof Tesseract === "undefined") {
        throw new Error("A biblioteca OCR não foi carregada. Verifique a conexão.");
      }

      setStatus("Inicializando o mecanismo OCR. Aguarde na primeira utilização...");

      // Evita ficar aguardando indefinidamente a inicialização.
      const initialization = Tesseract.createWorker("eng", 1, {
        logger: info => {
          if (info.status === "loading language traineddata") {
            setStatus("Carregando dados de reconhecimento de texto...");
          } else if (info.status === "initializing tesseract") {
            setStatus("Inicializando o mecanismo OCR...");
          } else if (info.status === "recognizing text" &&
                     typeof info.progress === "number") {
            setStatus(
              "Reconhecendo o BPM... " +
              Math.round(info.progress * 100) + "%"
            );
          }
        }
      });

      const timeout = new Promise((_, reject) => {
        setTimeout(() => {
          reject(new Error(
            "O OCR demorou demais para inicializar. Verifique a conexão e tente novamente."
          ));
        }, 60000);
      });

      try {
        worker = await Promise.race([initialization, timeout]);

        await worker.setParameters({
          preserve_interword_spaces: "1"
        });

        return worker;
      } catch (error) {
        // Se a inicialização falhar, permite uma nova tentativa.
        worker = null;
        throw error;
      }
    }

    function extractBpm(text) {
      const lines = text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean);

      for (let i = 0; i < lines.length; i++) {
        const normalized = lines[i]
          .toUpperCase()
          .replace(/[|]/g, "I");

        if (!/B\s*[P8]\s*M/.test(normalized)) {
          continue;
        }

        const sameLine = lines[i].match(/\d[\d\s.-]{3,}\d/g) || [];

        for (const candidate of sameLine) {
          const digits = candidate.replace(/\D/g, "");

          if (digits.length >= 5 && digits.length <= 9) {
            return digits;
          }
        }

        if (i + 1 < lines.length) {
          const nextCandidates =
            lines[i + 1].match(/\d[\d\s.-]{3,}\d/g) || [];

          for (const candidate of nextCandidates) {
            const digits = candidate.replace(/\D/g, "");

            if (digits.length >= 5 && digits.length <= 9) {
              return digits;
            }
          }
        }
      }

      return "";
    }

    async function recognizeBpm() {
      // Importante: esta função não altera processing.
      // O chamador controla o estado de processamento.
      if (!captured || !photo.width || !photo.height) {
        throw new Error("Nenhuma imagem capturada para reconhecimento.");
      }

      bpmInput.value = "";

      const ocr = await getWorker();

      setStatus("Lendo o texto da etiqueta...");

      const firstResult = await ocr.recognize(photo);
      let bpm = extractBpm(firstResult.data.text || "");

      if (!bpm) {
        setStatus("Primeira leitura inconclusiva. Melhorando o contraste...");

        const improved = preprocess(photo);
        const secondResult = await ocr.recognize(improved);

        bpm = extractBpm(secondResult.data.text || "");
      }

      if (bpm) {
        bpmInput.value = bpm;

        setStatus(
          "BPM identificado: " + bpm +
          ". Confira o número e toque em “Confirmar e consultar”."
        );
      } else {
        setStatus(
          "Não foi possível identificar o número associado a BPM. " +
          "Tente capturar novamente ou digite o número manualmente."
        );
      }
    }

    async function captureAndRead() {
      if (processing || captured) return;

      setBusy(true);

      try {
        await takePhoto();

        // CORREÇÃO: não chamar recognizeBpm enquanto processing estiver true.
        // Libera o estado antes de iniciar a leitura.
        setBusy(false);

        await recognizeBpm();

      } catch (error) {
        console.error("Falha na captura ou no OCR:", error);

        setStatus(
          "Falha na captura ou no reconhecimento: " +
          (error.message || "erro inesperado") +
          ". Tente novamente."
        );

      } finally {
        setBusy(false);
        captureBtn.disabled = true;
      }
    }

    async function retry() {
      if (processing) return;

      captured = false;
      bpmInput.value = "";

      photo.classList.add("hidden");
      video.classList.remove("hidden");
      moldura.classList.remove("hidden");

      cameraBox.style.aspectRatio = "4 / 3";

      await openCamera();
    }

    function closeCamera() {
      stopCamera();
      captured = false;

      photo.classList.add("hidden");
      video.classList.remove("hidden");
      moldura.classList.remove("hidden");

      retryBtn.classList.add("hidden");
      closeBtn.classList.add("hidden");
      openBtn.classList.remove("hidden");

      cameraBox.style.aspectRatio = "4 / 3";

      setStatus("Câmera fechada. Toque em “Abrir câmera” para começar.");
    }

    function searchBpm() {
      const bpm = bpmInput.value.trim().replace(/\D/g, "");

      if (!bpm) {
        setStatus("Informe ou reconheça um BPM antes de consultar.");
        bpmInput.focus();
        return;
      }

      if (bpm.length < 5 || bpm.length > 9) {
        setStatus("Confira o BPM: o número informado parece incompleto ou inválido.");
        bpmInput.focus();
        return;
      }

      stopCamera();

      window.location.href =
        APP_URL + "?bpm=" + encodeURIComponent(bpm);
    }

    openBtn.addEventListener("click", openCamera);
    captureBtn.addEventListener("click", captureAndRead);
    retryBtn.addEventListener("click", retry);
    closeBtn.addEventListener("click", closeCamera);
    searchBtn.addEventListener("click", searchBpm);

    bpmInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        searchBpm();
      }
    });

    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
