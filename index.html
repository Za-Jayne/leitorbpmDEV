
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142d4e">
  <title>Leitor BPM</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --marinho: #142d4e;
      --marinho2: #203f65;
      --verde: #20c878;
      --fundo: #f3f5f8;
      --texto: #202b3c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: var(--fundo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .cabecalho {
      padding: 18px;
      margin-bottom: 16px;
      color: white;
      background: var(--marinho);
      border-radius: 14px;
    }

    .cabecalho h1 {
      margin: 0 0 7px;
      font-size: 23px;
    }

    .cabecalho p {
      margin: 0;
      color: #d8e4f2;
      font-size: 14px;
      line-height: 1.4;
    }

    .painel {
      padding: 16px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 14px #142d4e12;
    }

    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #10151c;
      border-radius: 12px;
    }

    #video,
    #photo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #10151c;
    }

    #photo {
      position: absolute;
      inset: 0;
    }

    .moldura {
      position: absolute;
      left: 5%;
      top: 8%;
      width: 90%;
      height: 72%;
      border: 3px solid var(--verde);
      border-radius: 8px;
      pointer-events: none;
      box-shadow: 0 0 0 999px #00000018;
    }

    .orientacao {
      margin: 12px 0 16px;
      color: #536174;
      font-size: 13px;
      line-height: 1.5;
    }

    .botoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      min-height: 46px;
      padding: 12px 14px;
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .primario {
      color: white;
      background: var(--marinho);
    }

    .secundario {
      color: var(--marinho);
      background: #e7edf4;
    }

    .verde {
      width: 100%;
      margin-top: 12px;
      color: white;
      background: #168653;
    }

    .campo {
      margin-top: 18px;
    }

    .campo label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    #bpmInput {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border: 1px solid #cbd4df;
      border-radius: 9px;
      font-size: 21px;
      letter-spacing: 1px;
    }

    #status {
      min-height: 42px;
      margin-top: 14px;
      padding: 11px;
      border-radius: 8px;
      background: #edf1f6;
      color: #34445a;
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 360px) {
      body {
        padding: 10px;
      }

      .painel {
        padding: 12px;
      }

      .botoes {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="cabecalho">
      <h1>Leitor BPM</h1>
      <p>Capture a etiqueta patrimonial e confira o número reconhecido antes de consultar.</p>
    </header>

    <section class="painel">
      <div class="camera-box" id="cameraBox">
        <video
          id="video"
          autoplay
          muted
          playsinline
        ></video>

        <canvas id="photo" class="hidden"></canvas>

        <div class="moldura" id="moldura"></div>
      </div>

      <p class="orientacao">
        Enquadre a etiqueta inteira dentro da moldura verde. Mantenha o celular firme,
        aguarde o foco e toque em <strong>Capturar etiqueta</strong>.
      </p>

      <div class="botoes">
        <button type="button" id="openBtn" class="primario">
          Abrir câmera
        </button>

        <button type="button" id="captureBtn" class="primario" disabled>
          Capturar etiqueta
        </button>

        <button type="button" id="retryBtn" class="secundario hidden">
          Capturar novamente
        </button>

        <button type="button" id="closeBtn" class="secundario hidden">
          Fechar câmera
        </button>
      </div>

      <div class="campo">
        <label for="bpmInput">BPM reconhecido</label>
        <input
          id="bpmInput"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="O BPM aparecerá aqui"
        >

        <button type="button" id="searchBtn" class="verde">
          Confirmar e consultar
        </button>
      </div>

      <div id="status" role="status" aria-live="polite">
        Toque em “Abrir câmera” para começar.
      </div>
    </section>
  </main>

  <script>
    "use strict";

    // Endereço da aplicação Consulta Patrimonial.
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbwtc7P8xFefVvwFSMQHxDcGs-K4aWwbBwTrdyI5qH2JmoNIIhK1t5DbpdecyuXexLoVuQ/exec";

    const video = document.getElementById("video");
    const photo = document.getElementById("photo");
    const cameraBox = document.getElementById("cameraBox");
    const moldura = document.getElementById("moldura");
    const openBtn = document.getElementById("openBtn");
    const captureBtn = document.getElementById("captureBtn");
    const retryBtn = document.getElementById("retryBtn");
    const closeBtn = document.getElementById("closeBtn");
    const searchBtn = document.getElementById("searchBtn");
    const bpmInput = document.getElementById("bpmInput");
    const statusBox = document.getElementById("status");

    let stream = null;
    let worker = null;
    let captured = false;
    let processing = false;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function setBusy(busy) {
      processing = busy;
      captureBtn.disabled = busy || !stream || captured;
      openBtn.disabled = busy;
      retryBtn.disabled = busy;
      searchBtn.disabled = busy;
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.pause();
      video.srcObject = null;
      captureBtn.disabled = true;
    }

    async function openCamera() {
      if (processing) return;

      stopCamera();
      captured = false;
      bpmInput.value = "";

      photo.classList.add("hidden");
      video.classList.remove("hidden");
      moldura.classList.remove("hidden");
      retryBtn.classList.add("hidden");
      closeBtn.classList.remove("hidden");
      openBtn.classList.add("hidden");

      setStatus("Solicitando acesso à câmera...");

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });

        video.srcObject = stream;
        await video.play();

        await new Promise(resolve => {
          if (video.videoWidth > 0) {
            resolve();
          } else {
            video.addEventListener("loadedmetadata", resolve, { once: true });
          }
        });

        captureBtn.disabled = false;
        setStatus("Câmera ativa. Enquadre a etiqueta e capture.");
      } catch (error) {
        stopCamera();
        openBtn.classList.remove("hidden");
        closeBtn.classList.add("hidden");

        let message = "Não foi possível abrir a câmera.";

        if (error.name === "NotAllowedError" ||
            error.name === "PermissionDeniedError") {
          message += " Verifique a permissão de câmera do Chrome.";
        } else if (error.name === "NotFoundError") {
          message += " Nenhuma câmera compatível foi encontrada.";
        } else {
          message += " " + (error.message || "Verifique as permissões do navegador.");
        }

        setStatus(message);
      }
    }

    // Converte o Blob da câmera em uma imagem utilizável pelo canvas.
    async function blobToImageSource(blob) {
      if (typeof createImageBitmap === "function") {
        try {
          return await createImageBitmap(blob);
        } catch (error) {
          console.warn("createImageBitmap indisponível; tentando Image.", error);
        }
      }

      return new Promise((resolve, reject) => {
        const objectUrl = URL.createObjectURL(blob);
        const image = new Image();

        image.onload = () => {
          URL.revokeObjectURL(objectUrl);
          resolve(image);
        };

        image.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error("Não foi possível decodificar a foto da câmera."));
        };

        image.src = objectUrl;
      });
    }

    async function takePhoto() {
      if (!video.videoWidth || !video.videoHeight) {
        throw new Error("A câmera ainda não está pronta.");
      }

      const ctx = photo.getContext("2d", {
        willReadFrequently: true
      });

      // Primeiro, congela imediatamente o quadro que aparece na tela.
      // Isso garante uma imagem de segurança caso a foto de alta resolução falhe.
      photo.width = video.videoWidth;
      photo.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, photo.width, photo.height);

      video.pause();
      video.classList.add("hidden");
      photo.classList.remove("hidden");
      moldura.classList.add("hidden");
      captured = true;

      captureBtn.disabled = true;
      retryBtn.classList.remove("hidden");

      setStatus("Imagem capturada. Preparando a imagem para leitura...");

      // Inicia a foto de alta resolução, quando o navegador oferece suporte.
      // A imagem congelada acima permanece visível durante esse processo.
      const track = stream && stream.getVideoTracks()[0];

      if (track && "ImageCapture" in window) {
        let bitmap = null;

        try {
          const capture = new ImageCapture(track);
          const blob = await capture.takePhoto();

          if (!(blob instanceof Blob) || blob.size === 0) {
            throw new Error("A câmera não retornou uma foto válida.");
          }

          // Correção principal: takePhoto() retorna Blob, não uma imagem
          // que possa ser passada diretamente ao drawImage().
          bitmap = await blobToImageSource(blob);

          const width = bitmap.width || bitmap.naturalWidth;
          const height = bitmap.height || bitmap.naturalHeight;

          if (!width || !height) {
            throw new Error("A foto recebida não possui dimensões válidas.");
          }

          photo.width = width;
          photo.height = height;

          const photoContext = photo.getContext("2d", {
            willReadFrequently: true
          });

          photoContext.drawImage(bitmap, 0, 0, width, height);
        } catch (error) {
          // A imagem congelada do vídeo continua disponível como alternativa.
          console.warn(
            "Usando o quadro congelado do vídeo como alternativa.",
            error
          );
        } finally {
          if (bitmap && typeof bitmap.close === "function") {
            bitmap.close();
          }
        }
      }

      stopCamera();
      cameraBox.style.aspectRatio = photo.width + " / " + photo.height;

      setStatus("Imagem congelada. Iniciando reconhecimento do BPM...");
    }

    // Amplia e melhora o contraste para uma segunda leitura, se necessária.
    function preprocess(sourceCanvas) {
      const scale = Math.min(
        2,
        2600 / Math.max(sourceCanvas.width, sourceCanvas.height)
      );

      const result = document.createElement("canvas");
      result.width = Math.max(1, Math.round(sourceCanvas.width * scale));
      result.height = Math.max(1, Math.round(sourceCanvas.height * scale));

      const ctx = result.getContext("2d", {
        willReadFrequently: true
      });

      ctx.drawImage(sourceCanvas, 0, 0, result.width, result.height);

      const imageData = ctx.getImageData(0, 0, result.width, result.height);
      const pixels = imageData.data;

      for (let i = 0; i < pixels.length; i += 4) {
        const gray =
          0.299 * pixels[i] +
          0.587 * pixels[i + 1] +
          0.114 * pixels[i + 2];

        // Contraste moderado, preservando traços finos dos caracteres.
        const contrasted = Math.max(
          0,
          Math.min(255, (gray - 110) * 1.45 + 110)
        );

        pixels[i] = contrasted;
        pixels[i + 1] = contrasted;
        pixels[i + 2] = contrasted;
      }

      ctx.putImageData(imageData, 0, 0);
      return result;
    }

    async function getWorker() {
      if (worker) return worker;

      worker = await Tesseract.createWorker("eng", 1, {
        logger: info => {
          if (info.status === "recognizing text" &&
              typeof info.progress === "number") {
            const percent = Math.round(info.progress * 100);
            setStatus("Reconhecendo texto da etiqueta... " + percent + "%");
          }
        }
      });

      await worker.setParameters({
        preserve_interword_spaces: "1"
      });

      return worker;
    }

    // Procura os dígitos na linha identificada como BPM.
    // Isso reduz a chance de confundir o código de barras com o patrimônio.
    function extractBpm(text) {
      const lines = text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean);

      for (let i = 0; i < lines.length; i++) {
        const normalized = lines[i]
          .toUpperCase()
          .replace(/[|]/g, "I");

        if (!/B\s*[P8]\s*M/.test(normalized)) {
          continue;
        }

        // Prioriza os números da própria linha do BPM.
        const sameLine = lines[i].match(/\d[\d\s.-]{3,}\d/g) || [];

        for (const candidate of sameLine) {
          const digits = candidate.replace(/\D/g, "");
          if (digits.length >= 5 && digits.length <= 9) {
            return digits;
          }
        }

        // Se o OCR separou o número na linha seguinte, tenta essa linha.
        if (i + 1 < lines.length) {
          const nextLine = lines[i + 1];
          const nextCandidates = nextLine.match(/\d[\d\s.-]{3,}\d/g) || [];

          for (const candidate of nextCandidates) {
            const digits = candidate.replace(/\D/g, "");
            if (digits.length >= 5 && digits.length <= 9) {
              return digits;
            }
          }
        }
      }

      return "";
    }

    async function recognizeBpm() {
      if (processing) return;

      if (!captured || !photo.width || !photo.height) {
        setStatus("Abra a câmera e capture uma etiqueta primeiro.");
        return;
      }

      setBusy(true);
      bpmInput.value = "";

      try {
        const ocr = await getWorker();

        setStatus("Lendo o texto da etiqueta...");
        const firstResult = await ocr.recognize(photo);
        let bpm = extractBpm(firstResult.data.text || "");

        // Uma segunda leitura com contraste melhorado só ocorre
        // quando a primeira não identifica o número associado a BPM.
        if (!bpm) {
          setStatus("Melhorando o contraste para tentar identificar o BPM...");
          const improved = preprocess(photo);
          const secondResult = await ocr.recognize(improved);
          bpm = extractBpm(secondResult.data.text || "");
        }

        if (bpm) {
          bpmInput.value = bpm;
          setStatus(
            "BPM identificado: " + bpm +
            ". Confira o número e toque em “Confirmar e consultar”."
          );
        } else {
          setStatus(
            "Não consegui identificar com segurança o número ao lado de BPM. " +
            "Tente capturar novamente, mantendo a etiqueta focada, ou digite o BPM manualmente."
          );
        }
      } catch (error) {
        console.error("Erro no reconhecimento OCR:", error);
        setStatus(
          "Falha no reconhecimento: " +
          (error.message || "erro inesperado") +
          ". Você pode digitar o BPM manualmente."
        );
      } finally {
        setBusy(false);
        captureBtn.disabled = true;
      }
    }

    async function captureAndRead() {
      if (processing || captured) return;

      setBusy(true);

      try {
        await takePhoto();
        await recognizeBpm();
      } catch (error) {
        console.error("Falha na captura:", error);
        setStatus(
          "Falha na captura: " +
          (error.message || "erro inesperado") +
          ". Tente novamente."
        );
      } finally {
        setBusy(false);
        captureBtn.disabled = true;
      }
    }

    async function retry() {
      if (processing) return;

      captured = false;
      bpmInput.value = "";
      photo.classList.add("hidden");
      video.classList.remove("hidden");
      moldura.classList.remove("hidden");
      cameraBox.style.aspectRatio = "4 / 3";

      await openCamera();
    }

    function closeCamera() {
      stopCamera();
      captured = false;

      photo.classList.add("hidden");
      video.classList.remove("hidden");
      moldura.classList.remove("hidden");

      retryBtn.classList.add("hidden");
      closeBtn.classList.add("hidden");
      openBtn.classList.remove("hidden");

      cameraBox.style.aspectRatio = "4 / 3";
      setStatus("Câmera fechada. Toque em “Abrir câmera” para começar.");
    }

    function searchBpm() {
      const bpm = bpmInput.value.trim().replace(/\D/g, "");

      if (!bpm) {
        setStatus("Informe ou reconheça um BPM antes de consultar.");
        bpmInput.focus();
        return;
      }

      if (bpm.length < 5 || bpm.length > 9) {
        setStatus("Confira o BPM: o número informado parece incompleto ou inválido.");
        bpmInput.focus();
        return;
      }

      stopCamera();

      const url = APP_URL + "?bpm=" + encodeURIComponent(bpm);
      window.location.href = url;
    }

    openBtn.addEventListener("click", openCamera);
    captureBtn.addEventListener("click", captureAndRead);
    retryBtn.addEventListener("click", retry);
    closeBtn.addEventListener("click", closeCamera);
    searchBtn.addEventListener("click", searchBpm);

    bpmInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        searchBpm();
      }
    });

    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
