<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leitor BPM por Foto</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
      color: #202124;
    }

    main {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 { color: #174ea6; text-align: center; }

    button, input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: 0;
      background: #188038;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; cursor: not-allowed; }

    input {
      border: 1px solid #dadce0;
      background: white;
      color: #202124;
      text-align: center;
      font-weight: bold;
      font-size: 20px;
    }

    .fechar { background: #5f6368; }
    .capturar { background: #174ea6; }

    .camera-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      margin: 12px auto;
      border-radius: 8px;
      overflow: hidden;
      background: #202124;
    }

    #videoOCR {
      display: block;
      width: 100%;
      height: auto;
      max-height: 400px;
      object-fit: cover;
    }

    .guia-enquadramento {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      height: 35%;
      border: 2px dashed #ffeb3b;
      border-radius: 6px;
      pointer-events: none;
      box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.4);
    }

    #mensagemOCR {
      margin-top: 12px;
      text-align: center;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.5;
      font-weight: bold;
      color: #174ea6;
    }

    .instrucao {
      color: #5f6368;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
<main>
  <h2>Capturar Etiqueta BPM</h2>

  <p class="instrucao">
    Enquadre o número da etiqueta no retângulo amarelo e clique em capturar foto.
  </p>

  <button id="iniciarOCR" onclick="iniciarCamera()">
    📷 Abrir Câmera
  </button>

  <div id="painelOCR" hidden>
    <div class="camera-container">
      <video id="videoOCR" autoplay playsinline muted></video>
      <div class="guia-enquadramento"></div>
    </div>

    <button class="capturar" onclick="enviarFotoParaServidor()">
      📸 Tirar Foto e Consultar
    </button>

    <div id="mensagemOCR" aria-live="polite"></div>

    <label for="bpmOCR" style="display:block; margin-top:15px; font-size:13px; color:#5f6368; font-weight: bold;">
      BPM (Confirme ou digite se necessário):
    </label>

    <input
      id="bpmOCR"
      type="text"
      inputmode="numeric"
      placeholder="Digite ou capture o BPM"
      autocomplete="off"
    >

    <button id="confirmarOCR" onclick="confirmarOCR()" style="background: #188038;">
      ✔️ Confirmar BPM e Pesquisar na Planilha
    </button>

    <button class="fechar" onclick="pararCamera()">
      Fechar Câmera
    </button>
  </div>
</main>

<canvas id="canvasOculto" hidden></canvas>

<script>
  // ATENÇÃO: Cole a URL do seu Web App do Google Apps Script aqui
  const APP_URL = "https://script.google.com/macros/s/AKfycbwtc7P8xFefVvwFSMQHxDcGs-K4aWwbBwTrdyI5qH2JmoNIIhK1t5DbpdecyuXexLoVuQ/exec";

  let streamOCR = null;

  async function iniciarCamera() {
    const painel = document.getElementById("painelOCR");
    const video = document.getElementById("videoOCR");
    const status = document.getElementById("mensagemOCR");
    const botaoIniciar = document.getElementById("iniciarOCR");

    painel.hidden = false;
    botaoIniciar.disabled = true;
    status.textContent = "Iniciando câmera...";
    document.getElementById("bpmOCR").value = "";

    try {
      streamOCR = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });

      video.srcObject = streamOCR;
      await video.play();
      status.textContent = "Posicione o BPM no retângulo amarelo.";
    } catch (erro) {
      status.textContent = "Erro ao acessar a câmera: " + (erro.message || erro);
      botaoIniciar.disabled = false;
      painel.hidden = true;
    }
  }

  function enviarFotoParaServidor() {
    const video = document.getElementById("videoOCR");
    const canvas = document.getElementById("canvasOculto");
    const status = document.getElementById("mensagemOCR");
    const campoBpm = document.getElementById("bpmOCR");

    if (!video.videoWidth) {
      status.textContent = "Aguarde a câmera estabilizar...";
      return;
    }

    status.textContent = "Enviando foto para análise...";

    // Recorta a área central da etiqueta
    const larguraVideo = video.videoWidth;
    const alturaVideo = video.videoHeight;
    const recW = larguraVideo * 0.75;
    const recH = alturaVideo * 0.30;
    const recX = (larguraVideo - recW) / 2;
    const recY = (alturaVideo - recH) / 2;

    canvas.width = recW;
    canvas.height = recH;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, recX, recY, recW, recH, 0, 0, recW, recH);

    // Converte a imagem recortada para Base64 (JPG comprimido)
    const imagemBase64 = canvas.toDataURL("image/jpeg", 0.7);

    // Envia via fetch para o Google Apps Script usando JSONP/POST simulado por URL ou requisição CORS
    fetch(APP_URL, {
      method: "POST",
      mode: "no-cors", // Necessário para Apps Script web apps simples
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ imagem: imagemBase64 })
    }).then(() => {
      status.textContent = "Foto enviada! Se o número não aparecer abaixo, digite-o:";
    }).catch(err => {
      status.textContent = "Erro ao enviar foto. Digite o BPM manualmente abaixo.";
    });
  }

  function confirmarOCR() {
    const campo = document.getElementById("bpmOCR");
    const bpm = campo.value.trim();

    if (!/^\d+$/.test(bpm)) {
      alert("Por favor, digite ou informe um número de BPM válido.");
      return;
    }

    pararCamera();
    window.location.href = APP_URL + "?bpm=" + encodeURIComponent(bpm);
  }

  function pararCamera() {
    if (streamOCR) {
      streamOCR.getTracks().forEach(track => track.stop());
      streamOCR = null;
    }

    document.getElementById("videoOCR").srcObject = null;
    document.getElementById("painelOCR").hidden = true;
    document.getElementById("iniciarOCR").disabled = false;
    document.getElementById("mensagemOCR").textContent = "";
  }
</script>
</body>
</html>
